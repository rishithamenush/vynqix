name: vynqix
description: "Vynqix — Plan tomorrow. Master today. A premium local-first daily task scheduler."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Persistence
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  meta: ^1.16.0

  # Charts
  fl_chart: ^0.70.2
  phosphor_icons: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Regenerates the per-platform launcher icons from the masters in
  # assets/branding. See tool/generate_app_icon.py for the masters themselves.
  flutter_launcher_icons: ^0.14.4

# Run `dart run flutter_launcher_icons` after changing anything here.
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: ic_launcher
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#111827"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png
  macos:
    generate: true
    image_path: assets/branding/app_icon.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#111827"
    theme_color: "#2563EB"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Inter-LICENSE.txt

  fonts:
    # Inter (SIL Open Font License 1.1) is bundled rather than fetched at
    # runtime, so the app renders identically with no network access.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
